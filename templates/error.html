{% extends "base.html" %}
{% block title %}{{ titulo }} — CodeLogic IUP{% endblock %}

{% block content %}
<div style="display:flex; justify-content:center; padding:3rem 0;">
    <div class="auth-card" style="width:100%; max-width:30rem; text-align:center;">
        <p style="font-size:3rem; font-weight:800; color:var(--primary-light); margin:0;">{{ codigo }}</p>
        <h2>{{ titulo }}</h2>
        <p class="subtitle">{{ mensaje }}</p>
        {% if current_user.is_authenticated %}
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary btn-block btn-lg">Volver al inicio</a>
        {% else %}
        <a href="{{ url_for('index') }}" class="btn btn-primary btn-block btn-lg">Ir a la página principal</a>
        {% endif %}
    </div>
</div>
{% endblock %}
