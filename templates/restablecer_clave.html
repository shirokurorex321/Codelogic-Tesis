{% extends "base.html" %}
{% block title %}Nueva contraseña — CodeLogic IUP{% endblock %}

{% block content %}
<div class="auth-container" style="max-width:460px;margin:3rem auto;">
    <div class="card">
        <div class="card-header">
            <span class="card-title">Elige tu contraseña nueva</span>
        </div>

        <form method="POST" action="{{ url_for('restablecer_clave', token=token) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label class="form-label" for="password">Contraseña nueva</label>
                <input type="password" id="password" name="password" class="form-input"
                       placeholder="Mínimo 6 caracteres" required minlength="6"
                       autocomplete="new-password" autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirm_password">Repítela</label>
                <input type="password" id="confirm_password" name="confirm_password"
                       class="form-input" placeholder="La misma de arriba" required
                       minlength="6" autocomplete="new-password">
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                Guardar y entrar
            </button>
        </form>

        <p style="font-size:.82rem;opacity:.6;margin-top:1rem;line-height:1.6;">
            Elige algo que recuerdes pero que nadie pueda adivinar. Evita tu
            nombre, tu fecha de nacimiento o secuencias como 123456.
        </p>
    </div>
</div>
{% endblock %}
