<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CodeLogic IUP">
  <title>CodeLogic IUP</title>
  <defs>
    <!-- Violeta institucional a cyan, los dos colores de la plataforma -->
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#9333ea"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Placa redondeada -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#fondo)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#brillo)"/>

  <!-- La marca </> — trazos gruesos para que se lea a 16 px -->
  <g fill="none" stroke="#ffffff" stroke-width="5.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 20 L11 32 L21 44"/>
    <path d="M43 20 L53 32 L43 44"/>
    <path d="M36 15 L28 49" stroke-width="5"/>
  </g>
</svg>
