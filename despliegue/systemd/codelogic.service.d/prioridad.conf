# CodeLogic sostiene el trabajo de grado y el pilotaje con 40 estudiantes.
# Ante cualquier competencia por recursos, gana siempre.
[Service]
# Peso alto: al repartir CPU, recibe ~10 veces más que un servicio normal
CPUWeight=10000
IOWeight=10000
# Memoria que el kernel le protege aunque el sistema esté bajo presión
MemoryMin=1G
MemoryLow=2G
# Y que sea de los últimos candidatos si el kernel tuviera que matar algo
OOMScoreAdjust=-500
